# Docker Dojo: four containers.
#   web     nginx: serves the Vue app, routes /api -> api, /app (websockets) -> reverb
#   api     Laravel on php-fpm
#   reverb  same image as api, running Laravel Reverb for the live tracker
#   db      MySQL 8.4 (not published to the host)
#
# Local:  docker compose up -d --build   ->  http://localhost:8000
# Deploy: copy .env.example to .env and set real secrets first.
# Limits total 3 CPUs / ~1.5GB, sized from a 150-student load test (see README).
name: docker-dojo

x-laravel-env: &laravel-env
  APP_NAME: Docker Dojo
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${APP_URL:-http://localhost:8000}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: dojo
  DB_USERNAME: dojo
  DB_PASSWORD: ${DB_PASSWORD:-dojo-local-only}
  CACHE_STORE: database
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  DOJO_JOIN_PER_MINUTE: ${DOJO_JOIN_PER_MINUTE:-120}
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-dojo}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-dojo-local-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-dojo-local-secret}
  # How the api container reaches Reverb: by service name, over the internal network.
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dojo
      MYSQL_USER: dojo
      MYSQL_PASSWORD: ${DB_PASSWORD:-dojo-local-only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dojo-local-root}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      # TCP to 127.0.0.1 only answers once init is done (the init server has networking off).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # Idle ~480MB, mostly MySQL's default buffers; barely moves under load.
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  api:
    build: ./apps/api
    image: docker-dojo-api
    restart: unless-stopped
    environment: *laravel-env
    depends_on:
      db:
        condition: service_healthy
    # php-fpm runs up to 5 workers (~10MB each, 128MB PHP limit per request).
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }

  reverb:
    build: ./apps/api          # same Dockerfile as api -> fully cached second build
    image: docker-dojo-api
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *laravel-env
    depends_on:
      api:
        condition: service_started
    # One process; ~40MB with 150 live-tracker connections open.
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  web:
    build: ./apps/web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      - api
      - reverb
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64M }

volumes:
  dbdata:
