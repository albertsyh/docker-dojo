# Production only: compose.prod.yaml mounts this into the web container's nginx.
#
# There, web publishes no port, so every connection arrives from the cloudflared container
# on the compose network. cloudflared forwards Cloudflare's CF-Connecting-IP header (the
# real client address). Without this, every student shares cloudflared's address, and so
# one join rate-limit bucket. nginx then passes the real address to Laravel as REMOTE_ADDR.
#
# Trusted only from private (container network) addresses. Never mount this on a stack
# whose web port is published: anyone could then set the header and pick their own IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
