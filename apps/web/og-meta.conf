# Link previews: crawlers don't run the app, so index.html's __OG_*__ placeholders are filled in
# by nginx with sub_filter. Each main route gets its own title and description; every page shares
# one image (og.png). Included by apps/web/nginx.conf and docs/enterprise/edge/edge.conf.template,
# which each fill in __OG_ORIGIN__ their own way.
# $request_uri, not $uri: after try_files, $uri is always /index.html.
map $request_uri $og_title {
    "~^/exercises(?:[/?]|$)"   "Exercises · Docker Dojo";
    "~^/take-home(?:[/?]|$)"   "Take-home tracks · Docker Dojo";
    "~^/quiz(?:[/?]|$)"        "Quiz · Docker Dojo";
    "~^/live(?:[/?]|$)"        "Live · Docker Dojo";
    "~^/chat(?:[/?]|$)"        "Chat · Docker Dojo";
    "~^/glossary(?:[/?]|$)"    "Glossary · Docker Dojo";
    "~^/references(?:[/?]|$)"  "References · Docker Dojo";
    default                    "Docker Dojo";
}
map $request_uri $og_description {
    "~^/exercises(?:[/?]|$)"   "Hands-on Docker exercises you run on your own machine, from your first container to Compose.";
    "~^/take-home(?:[/?]|$)"   "Self-paced Docker tracks for after the workshop, each on one app from start to finish.";
    "~^/quiz(?:[/?]|$)"        "A short quiz to check what stuck from the workshop.";
    "~^/live(?:[/?]|$)"        "The whole room's progress through the workshop, as it happens.";
    "~^/chat(?:[/?]|$)"        "Questions from the room during the workshop.";
    "~^/glossary(?:[/?]|$)"    "Every Docker term used in the workshop, in plain words.";
    "~^/references(?:[/?]|$)"  "Videos and reading for after the workshop, grouped by topic.";
    default                    "A 90-minute, hands-on Docker and Compose workshop. Copy a command, run it, tick it off.";
}
# The path for og:url, checked against a strict pattern because it comes from the request and
# ends up inside an HTML attribute. The query string is left off.
map $request_uri $og_path {
    "~^(?<p>/[A-Za-z0-9/_.~-]*)" $p;
    default                      /;
}
