# The only public entry point. Serves the built Vue app and routes:
#   /api/*  -> Laravel via FastCGI on the "api" container
#   /app/*  -> Reverb websockets on the "reverb" container

# Link previews: titles, descriptions and the page path (shared with the enterprise edge).
include /etc/nginx/og-meta.conf;
# The link previews' origin is whichever host the request came in on, checked against a strict
# pattern because it comes from the request and ends up inside an HTML attribute.
map $http_host $og_host {
    "~^(?<h>[A-Za-z0-9.-]+(?::[0-9]+)?)$" $h;
    default                               localhost;
}
# Behind the Cloudflare Tunnel, nginx itself is reached over http; cloudflared says https.
map $http_x_forwarded_proto $og_scheme {
    https   https;
    default $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    # Look api and reverb up through Docker's DNS on each request (cached 10s), not once at
    # startup. Recreating either container can give it a new IP; a name resolved at startup
    # would keep nginx sending traffic to the old one (502s) until web restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;
    set $reverb_upstream http://reverb:8080;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass $api_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # Browser websocket connections only. Reverb's HTTP publishing API (/apps/*)
    # is deliberately not exposed: the api container reaches it on the internal network.
    location /app/ {
        proxy_pass $reverb_upstream;  # no URI part, so the request path passes through unchanged
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        sub_filter_once off;
        sub_filter '__OG_TITLE__' $og_title;
        sub_filter '__OG_DESCRIPTION__' $og_description;
        sub_filter '__OG_ORIGIN__' $og_scheme://$og_host;
        sub_filter '__OG_PATH__' $og_path;
    }
}
