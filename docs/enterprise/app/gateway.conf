# The app instance's only entry point. It replaces the single-host setup, where the web
# container spoke FastCGI straight to php-fpm. FastCGI has no authentication or encryption,
# so php-fpm's port 9000 never leaves this instance; the edge speaks HTTPS to this instead.
server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    ssl_certificate     /etc/nginx/tls/app.crt;
    ssl_certificate_key /etc/nginx/tls/app.key;
    ssl_protocols TLSv1.3;

    # Mutual TLS: the caller must present a certificate from the internal CA...
    ssl_client_certificate /etc/nginx/tls/internal-ca.crt;
    ssl_verify_client on;
    # ...and it must be the edge's. The CA may sign other services' certificates too.
    if ($ssl_client_s_dn !~ "^CN=edge(,|$)") {
        return 403;
    }

    # The student's address, as the edge saw it, for the per-IP join limit. Trusting the
    # header from any source address is safe only because of the mTLS check above: every
    # request that gets this far came from the edge, whatever NAT or load balancer it crossed.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    # Resolve api and reverb per request, so a recreated container's new IP is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;
    set $reverb_upstream http://reverb:8080;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass $api_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # Browser websockets only. Reverb's publishing API (/apps/*) is reached by the api
    # container directly and is deliberately not routed here.
    location /app/ {
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
